# Two Cloudflare apps are built from this repo (checked 2 Nov 2026):
# - the PAGES app "linktolead" serves the live site linktolead.exploraself.com
#   (public/ + functions/ as Pages Functions). Its variables and secrets
#   (MENTOR_KEY, MAILCHIMP_API_KEY, RESEND_API_KEY, STRIPE_SECRET_KEY …) live
#   in that app; after changing one, Deployments → Retry deployment.
# - this WORKER "linktolead" (this file, `npx wrangler deploy`) runs the hourly
#   letters ([triggers] below; SERIES_MODE is set on the Worker). It also
#   bundles worker.js, which hands /api/* to functions/api/, so it can serve
#   the same site at its workers.dev address. No build step for either.
name = "linktolead"
compatibility_date = "2026-10-26"
main = "worker.js"
# Variables set in the dashboard (MAIL_POSTAL_ADDRESS, MENTOR_KEY, MAIL_FROM)
# survive each `wrangler deploy`. Without this, a deploy from this file, which
# declares no [vars], removes them.
keep_vars = true
#
# The LAB workbook (functions/api/workbook.js): the PRIVATE R2 bucket
# exploraself-workbooks, bound as WORKBOOKS on the PAGES app (Settings →
# Bindings → R2 bucket, then Deployments → Retry deployment). It holds the
# workbook PDF: personal-leadership-lab-workbook-2026.pdf, or the one PDF
# under any name (as it comes from Drive). Paid content: never in this repo,
# never public. Without the binding the button explains it is not ready yet.
#
# The study room's music (functions/api/music.js): the R2 bucket
# music-background, bound as MUSIC on the PAGES app (Settings → Bindings →
# R2 bucket, then Deployments → Retry deployment). Two folders, Classic/ and
# Modern/: every audio file in them shows in the player, named by its file
# name. Without the binding the player says "No music yet".
#
# Mailchimp (functions/_mailchimp.js), all optional, set in the dashboard:
#   MAILCHIMP_MODE          text    "test" stops every call; each join is only logged
#   MAILCHIMP_FORM_URL      text    another sign-up form link; empty = Link to Lead form
#   MAILCHIMP_AUDIENCE_ID   text    audience for API mode; empty = the form's list id
#   MAILCHIMP_API_KEY       secret  switches to API mode (tags, unsubscribe)
#   MAILCHIMP_DOUBLE_OPTIN  text    "yes" = Mailchimp confirms by email first
# Never put the API key in this file.

# "Continue with Google" (functions/_google.js): the public Web client ID from
# Google Cloud (Google Auth Platform → Clients → linktolead, origin
# https://linktolead.exploraself.com). It is not a secret; the client secret is
# not used and never goes here. keep_vars above still keeps the dashboard's.
[vars]
GOOGLE_CLIENT_ID = "313189996932-63o1k2imuk2ospi47fnd12ak51oe1pj6.apps.googleusercontent.com"

[assets]
directory = "./public"
binding = "ASSETS"
# An address with no page gets public/404.html and a real 404 status, never
# the home page. Every page is its own folder (/road1 … /road4, /north2, /north3…).
not_found_handling = "404-page"
# The API and the old sales-page addresses reach worker.js. Each old address
# is a 302 to its road, query string kept (functions/_landing.js): / and /b →
# /road1/, /compass/welcome, /compass/welcome-a and /c → /north3/, /a → /road3/.
# /compass/* covers /compass/welcome and /compass/welcome-a (Wrangler refuses
# a rule that another rule already covers). Every page and file is served as before.
run_worker_first = ["/api/*", "/", "/b", "/b/", "/c", "/c/", "/a", "/a/", "/compass", "/compass/*"]

# The student record: programme answers, worksheet figures, North Star reports and
# notes to the mentor. Free tier; see functions/_shared.js for how routes behave
# when this binding is absent (they refuse politely, the site keeps serving).
[[d1_databases]]
binding = "DB"
database_name = "exploraself-blueprint"
database_id = "615c8759-d290-4ff2-86a9-3f977d80f2b5"

# The Resend key for every email the site sends (functions/_mail.js).
# It lives in the account's Secrets Store, not in this file; this only binds it.
[[secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "1278d7b13e164c4bbb2e42255f404648"
secret_name = "RESEND_API_KEY"

# The hourly run (worker.js `scheduled`, JOBS): the letters that follow each
# pain (functions/_series.js, only when SERIES_MODE is set in the dashboard)
# and the 12-day letters ("12 Days to Start Winning", functions/_course.js) go
# out from 8:00 in each founder's own time zone, so the run needs to look
# every hour. Minute 7, off the busy top of the hour. A job that has nothing
# to send does nothing.
[triggers]
crons = ["7 * * * *"]
