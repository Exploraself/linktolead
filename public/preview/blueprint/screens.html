<title>Blueprint on a phone</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--paper:#FBF7EE;--panel:#FFFDF7;--ink:#2B1B12;--soft:#6B5A4B;--line:#E4DAC8;--gold-ink:#8A6A1F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#120D08;--panel:#1C150E;--ink:#F1E8D6;--soft:#B9A992;--line:#3A2E22;--gold-ink:#D9B865;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
.pv{margin:0;background:var(--ink);color:var(--paper);font-size:12px;text-align:center;padding:6px 12px}
main{max-width:1240px;margin:0 auto;padding:24px 16px 60px}
h1{font:500 clamp(28px,7vw,40px)/1.15 Newsreader,Georgia,serif;margin:.2em 0}
.lede{color:var(--soft);max-width:62ch}
.lede a{color:var(--gold-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:22px}
figure{margin:0}img{width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
figcaption{font-size:14px;color:var(--soft);margin-top:6px}
</style>
</head>

<p class="pv">Preview for Alexandru · not part of the live site</p>
<main>
<h1>The Blueprint, on a phone</h1>
<p class="lede">The real programme screen at 390px, from the draft pull request: one field on screen, the day as a tap, “Done when”, last week first, the readings, and My Blueprint. Test founder, test words. <a href="./">The skeleton</a> · <a href="level-01-one-at-a-time.html">Try Level 01</a></p>
<div class="grid">
<figure><img src="screens/01-tap-light.png" alt="Level 01 opens: one tap, keys 1 to 5. The topic sits above the question." loading="lazy" width="390"><figcaption>Level 01 opens: one tap, keys 1 to 5. The topic sits above the question.</figcaption></figure>
<figure><img src="screens/03-blank-light.png" alt="The first blank: “Why it matters” (Inform), then the sentence, one blank lit at a time." loading="lazy" width="390"><figcaption>The first blank: “Why it matters” (Inform), then the sentence, one blank lit at a time.</figcaption></figure>
<figure><img src="screens/04-day-light.png" alt="The day is a tap: seven chips, or a date." loading="lazy" width="390"><figcaption>The day is a tap: seven chips, or a date.</figcaption></figure>
<figure><img src="screens/05-done-light.png" alt="“Done when”, checkable on Sunday, then: how sure are you?" loading="lazy" width="390"><figcaption>“Done when”, checkable on Sunday, then: how sure are you?</figcaption></figure>
<figure><img src="screens/06-lines-light.png" alt="The four lines, “Done when” under “What you will do”, and what the founder keeps, filled with their words (Copy)." loading="lazy" width="390"><figcaption>The four lines, “Done when” under “What you will do”, and what the founder keeps, filled with their words (Copy).</figcaption></figure>
<figure><img src="screens/07b-got-partly-light.png" alt="From Level 02: last week first. “Partly” shows what they estimated, and a smaller step." loading="lazy" width="390"><figcaption>From Level 02: last week first. “Partly” shows what they estimated, and a smaller step.</figcaption></figure>
<figure><img src="screens/08-week-light.png" alt="Your week: four actions, each with its day. The North Star’s weakest domain is the one move." loading="lazy" width="390"><figcaption>Your week: four actions, each with its day. The North Star’s weakest domain is the one move.</figcaption></figure>
<figure><img src="screens/09b-reading-more-light.png" alt="The chapter reading: what was done, how good the estimates were, old and new beliefs, where they began, his words." loading="lazy" width="390"><figcaption>The chapter reading: what was done, how good the estimates were, old and new beliefs, where they began, his words.</figcaption></figure>
<figure><img src="screens/10-carry-light.png" alt="Carry one forward: the undone action that matters most." loading="lazy" width="390"><figcaption>Carry one forward: the undone action that matters most.</figcaption></figure>
<figure><img src="screens/11-carryday-light.png" alt="Its day, and the door to the next chapter." loading="lazy" width="390"><figcaption>Its day, and the door to the next chapter.</figcaption></figure>
<figure><img src="screens/12-blueprint-light.png" alt="My Blueprint: the founder’s twelve weeks in eight parts, printable." loading="lazy" width="390"><figcaption>My Blueprint: the founder’s twelve weeks in eight parts, printable.</figcaption></figure>
<figure><img src="screens/12b-blueprint-offer-light.png" alt="A part of the Blueprint: their own sentence and what they keep; parts not yet written link to their level." loading="lazy" width="390"><figcaption>A part of the Blueprint: their own sentence and what they keep; parts not yet written link to their level.</figcaption></figure>
<figure><img src="screens/04-day-dark.png" alt="Dark: the day." loading="lazy" width="390"><figcaption>Dark: the day.</figcaption></figure>
<figure><img src="screens/06-lines-dark.png" alt="Dark: four lines and what they keep." loading="lazy" width="390"><figcaption>Dark: four lines and what they keep.</figcaption></figure>
<figure><img src="screens/08-week-dark.png" alt="Dark: the week." loading="lazy" width="390"><figcaption>Dark: the week.</figcaption></figure>
<figure><img src="screens/12b-blueprint-offer-dark.png" alt="Dark: My Blueprint." loading="lazy" width="390"><figcaption>Dark: My Blueprint.</figcaption></figure>
