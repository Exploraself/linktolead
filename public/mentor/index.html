<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentor · The Founder's Blueprint</title>
<link rel="icon" href="/compass/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/compass/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/compass/assets/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="/assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/libre-franklin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--paper:#F7F2E7;--panel:#FFFCF4;--ink:#1C1309;--gold:#C9A24A;--gold-ink:#6E5213;--cream:#EFE4CC;
  --line:#D6C9AC;--muted:#6A6052;--ok:#2C6B43;--warn:#A8623A;
  --self:#A8623A;--people:#4C7355;--work:#36607F;--market:#9A7418;
  --display:'Fraunces',Georgia,serif;--body:'Libre Franklin',system-ui,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.15}
p{margin:0}
header{background:var(--ink);color:#F4ECDA;border-bottom:3px solid var(--gold)}
header .wrap{padding:22px 18px}
header h1{font-size:26px}
header p{font-size:12.5px;color:#9D917E;margin-top:5px}
.gate{max-width:420px;margin:70px auto;background:var(--panel);border:1px solid var(--line);
  border-top:3px solid var(--gold);padding:28px}
.gate h2{font-size:21px}
.gate p{font-size:13.5px;color:var(--muted);margin-top:9px}
input,textarea,select{font:inherit;width:100%;background:#fff;border:1px solid var(--line);padding:11px 12px;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
button{font:600 14px/1 var(--body);background:var(--gold);color:#1C1309;border:0;padding:13px 18px;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--gold-ink);font-weight:600}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 0}
.count{font:600 11px/1 var(--body);letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel)}
th{text-align:left;font:600 10px/1.4 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-ink);
  padding:11px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--cream)}
.nm{font-weight:600;cursor:pointer}
.nm:hover{text-decoration:underline}
.em{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font:600 9.5px/1 var(--body);letter-spacing:.9px;text-transform:uppercase;
  padding:6px 8px;border:1px solid var(--line);color:var(--muted)}
.pill.free{color:var(--ok);border-color:var(--ok)}
.pill.lab{color:var(--work);border-color:var(--work)}
.pill.hub,.pill.premium{color:var(--gold-ink);border-color:var(--gold);background:var(--cream)}
.pill.session{color:var(--gold-ink);border-color:var(--gold)}
.prog{display:block;height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:100px}
.prog i{display:block;height:100%;background:var(--gold)}
.tiny{font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
.panel{background:var(--panel);border:1px solid var(--line);padding:22px;margin-top:18px}
.panel h2{font-size:22px}
.kv{display:grid;gap:3px;margin-top:14px}
@media(min-width:720px){.kv{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--cream);padding:12px 13px}
.k b{display:block;font:600 9.5px/1.3 var(--body);letter-spacing:1.1px;text-transform:uppercase;color:var(--gold-ink)}
.k span{display:block;font-family:var(--display);font-size:19px;margin-top:4px}
.dom{margin-top:20px;border-top:2px solid var(--ink);padding-top:16px}
.dom h3{font-size:17px}
.dom.self h3{color:var(--self)} .dom.people h3{color:var(--people)}
.dom.work h3{color:var(--work)} .dom.market h3{color:var(--market)}
.ans{margin-top:10px;border-left:3px solid var(--line);padding:3px 0 3px 13px}
.ans em{display:block;font-style:normal;font:600 9.5px/1.3 var(--body);letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.ans p{font-size:14px;line-height:1.6;margin-top:3px;white-space:pre-wrap}
.note{background:var(--cream);border-left:3px solid var(--warn);padding:14px 15px;margin-top:12px}
.note .meta{font:600 10px/1.3 var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.note p{margin-top:7px;white-space:pre-wrap}
.note textarea{margin-top:10px;min-height:70px}
.err{color:var(--warn);font-size:13.5px;margin-top:11px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
footer{padding:30px 18px 50px;font-size:12px;color:var(--muted)}
.em.warn{color:#A8623A;font-weight:600}
.warn{color:#A8623A}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:22px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);color:var(--ink);padding:14px;text-align:left;font-weight:500}
.tile b{font-family:var(--display);font-size:30px;font-weight:500;line-height:1}
.tile span{font-size:12px;color:var(--muted);line-height:1.3}
.tile.on{background:var(--cream);border-color:var(--ink)}
.needs{list-style:none;margin:12px 0 0;padding:0}
.needs li{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:8px 10px;font-size:12.5px}
.tscroll{overflow-x:auto}
td select{min-width:150px;padding:8px}
.danger{color:#A8623A;border-color:#A8623A}
.danger-solid{background:#A8623A;color:#fff}
.flash{background:var(--cream);border-left:3px solid var(--gold);padding:10px 12px;margin-bottom:12px}
.mc .flash{margin:10px 0 0;color:var(--ink)}
.mclog td{vertical-align:top}.mclog td:last-child{min-width:260px}
.pre{white-space:pre-wrap;font:12.5px/1.6 ui-monospace,Menlo,monospace;background:var(--cream);padding:14px;margin-top:12px;overflow-x:auto}
.dlg{position:fixed;inset:0;background:rgba(14,10,5,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;overflow-y:auto}
.dlgbox{background:var(--panel);border-top:3px solid var(--gold);padding:22px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;margin:auto}
.dlgbox label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.dlgbox fieldset{border:1px solid var(--line);padding:10px 12px}
.dlgbox .rad{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.dlgbox .rad input{width:auto}
</style>
</head>
<body>
<header><div class="wrap"><h1>Mentor</h1><p>The Founder&rsquo;s Blueprint · dashboard and account manager</p></div></header>
<main class="wrap" id="main"></main>
<footer class="wrap">Private. Nothing here is shared with anyone else.</footer>

<script type="module" src="/mentor/mentor.js"></script>
</body>
</html>
